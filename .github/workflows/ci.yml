name: Superproject CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Verify dependency lockfile
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test (hard failure on timeout/failure)
        run: pnpm test -- --reporter=verbose
      - name: Run no-key mock workflow
        run: pnpm exec tsx scripts/superproject-demo.ts --mock "Acceptance test"
