name: Legacy TypeScript Superproject Tests
on:
  push:
    branches: [main]
    paths:
      - "src/superproject/**"
      - "src/__tests__/superproject*.test.ts"
      - "scripts/superproject-demo.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "src/superproject/**"
      - "src/__tests__/superproject*.test.ts"
      - "scripts/superproject-demo.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Verify dependency lockfile
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Run focused superproject tests
        run: pnpm exec vitest run src/__tests__/superproject.test.ts src/__tests__/superproject-provider.test.ts --reporter=verbose
      - name: Run no-key mock workflow
        run: pnpm exec tsx scripts/superproject-demo.ts --mock "Acceptance test"
